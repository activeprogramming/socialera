name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y autoconf libtool pkg-config zip unzip zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install Cython and Buildozer
      run: |
        pip install --upgrade cython buildozer

    - name: Initialize Buildozer
      run: buildozer init

    - name: Update buildozer.spec
      run: |
        sed -i 's/^title = .*/title = Historia Viva/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = historiaviva/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.activeprogramming/' buildozer.spec
        sed -i 's/^source.dir = .*/source.dir = ./' buildozer.spec
        sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,kv,json/' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.1/' buildozer.spec
        sed -i 's/^icon.filename = .*/icon.filename = icono.png/' buildozer.spec
        sed -i 's/^fullscreen = .*/fullscreen = 1/' buildozer.spec
        sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
        # Agregar líneas clave
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "android.ndk = 23b" >> buildozer.spec
        echo "android.sdk = 30" >> buildozer.spec

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK
      run: |
        rm -rf .buildozer
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HistoriaViva-APK
        path: bin/*.apk