name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'   # <- CRUCIAL: 3.10, no 3.11

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y autoconf libtool pkg-config zip unzip zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        # libtinfo5 workaround
        sudo apt install -y libtinfo6
        sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5

    - name: Install Cython (specific version) and Buildozer
      run: |
        pip install --upgrade pip
        pip install cython==0.29.37   # <- versión estable
        pip install buildozer

    - name: Initialize Buildozer
      run: buildozer init

    - name: Configure buildozer.spec
      run: |
        sed -i 's/^title = .*/title = Historia Viva/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = historiaviva/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.activeprogramming/' buildozer.spec
        sed -i 's/^source.dir = .*/source.dir = ./' buildozer.spec
        sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,kv,json/' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.1,cython==0.29.37/' buildozer.spec
        sed -i 's/^icon.filename = .*/icon.filename = icono.png/' buildozer.spec
        sed -i 's/^fullscreen = .*/fullscreen = 1/' buildozer.spec
        sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
        # Forzar aceptación de licencias y versiones
        echo "android.accept_sdk_license = True" >> buildozer.spec
        echo "android.sdk = 30" >> buildozer.spec
        echo "android.ndk = 23b" >> buildozer.spec
        echo "android.build_tools = 30.0.3" >> buildozer.spec
        echo "android.api = 30" >> buildozer.spec

    - name: Build APK
      run: |
        # Clean previous builds
        rm -rf .buildozer
        # Accept licenses automatically
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HistoriaViva-APK
        path: bin/*.apk